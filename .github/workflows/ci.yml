name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: "moonrepo/setup-toolchain@v0"
        with:
          auto-install: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: コンパイル
        run: bun compile

      # - name: テスト実行
      #   run: npm run test
