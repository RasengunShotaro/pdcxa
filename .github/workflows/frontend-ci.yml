name: CI

on:
  push:
    branches-ignore:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@v2.5.0

      - name: Playwright のバージョンを取得 (キャッシュキー用)
        id: playwright-version
        working-directory: apps/frontend
        run: echo "version=$(bunx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Playwright ブラウザのキャッシュ
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Playwright chromium をインストール (キャッシュミス時のみ)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/frontend
        run: bunx playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: 型チェック
        run: bun run check-types

      - name: テスト
        run: bun run test
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test

      - name: API 契約の再生成ズレ検出
        run: |
          (cd apps/frontend && bun run api:generate)
          git diff --exit-code apps/backend/openapi.json apps/frontend/src/schema
